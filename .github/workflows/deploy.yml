name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Determine base path
        id: base_path
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "path=/$REPO_NAME/pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "dir=pr${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "path=/$REPO_NAME" >> $GITHUB_OUTPUT
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: nix develop --command bun install

      - name: Install Playwright Browsers
        run: nix develop --command bunx playwright install --with-deps

      - name: Prepare build environment
        id: build_env
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "git_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build
        run: nix develop --command bun run build
        env:
          PUBLIC_BASE_PATH: ${{ steps.base_path.outputs.path }}
          VITE_APP_VERSION: ${{ steps.build_env.outputs.version }}
          VITE_GIT_HASH: ${{ steps.build_env.outputs.git_hash }}

      - name: Run E2E tests
        run: nix develop --command bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy to gh-pages branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && success())
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: ${{ steps.base_path.outputs.dir }}
          keep_files: true

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const repoName = context.repo.repo;
            const owner = context.repo.owner;
            const previewUrl = `https://${owner}.github.io/${repoName}/pr${prNumber}/`;
            const comment = `🚀 Preview deployed to: ${previewUrl}`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: owner,
              repo: repoName,
              issue_number: prNumber
            });
            
            const botComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && c.body.includes('Preview deployed to:')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: owner,
                repo: repoName,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: owner,
                repo: repoName,
                issue_number: prNumber,
                body: comment
              });
            }
