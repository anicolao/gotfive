name: Regenerate Screenshots
on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Install dependencies
      run: nix develop --command bun install

    - name: Install Playwright Browsers
      run: nix develop --command bunx playwright install chromium

    - name: Update Snapshots
      run: nix develop --command bun run test:e2e:update-snapshots

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: "chore: regenerate e2e screenshots"
        title: "chore: regenerate e2e screenshots"
        body: "Automated screenshot regeneration"
        branch: regenerate-screenshots
        delete-branch: true
