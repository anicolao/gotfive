<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1920" fill="#1E1E24" />
  
  <!-- Subtle pattern or texture -->
  <circle cx="540" cy="960" r="800" fill="#2B2B36" opacity="0.5" />

  <!-- Top Zone: Opponents -->
  <g transform="translate(40, 100)">
    <rect width="300" height="140" rx="24" fill="#3A3A4A" />
    <text x="150" y="45" font-family="sans-serif" font-weight="bold" font-size="28" fill="#A0A0B0" text-anchor="middle">Alice</text>
    <rect x="20" y="70" width="40" height="50" rx="8" fill="#4CAF50" />
    <rect x="75" y="70" width="40" height="50" rx="8" fill="#9C27B0" />
    <rect x="130" y="70" width="40" height="50" rx="8" fill="#FF9800" />
    <rect x="185" y="70" width="40" height="50" rx="8" fill="#2196F3" />
    <rect x="240" y="70" width="40" height="50" rx="8" fill="#E91E63" />
  </g>
  
  <g transform="translate(390, 100)">
    <rect width="300" height="140" rx="24" fill="#3A3A4A" />
    <text x="150" y="45" font-family="sans-serif" font-weight="bold" font-size="28" fill="#A0A0B0" text-anchor="middle">Bob</text>
    <rect x="20" y="70" width="40" height="50" rx="8" fill="#2196F3" />
    <rect x="75" y="70" width="40" height="50" rx="8" fill="#4CAF50" />
    <rect x="130" y="70" width="40" height="50" rx="8" fill="#E91E63" />
    <rect x="185" y="70" width="40" height="50" rx="8" fill="#FF9800" />
    <rect x="240" y="70" width="40" height="50" rx="8" fill="#9C27B0" />
  </g>

  <g transform="translate(740, 100)">
    <rect width="300" height="140" rx="24" fill="#3A3A4A" />
    <text x="150" y="45" font-family="sans-serif" font-weight="bold" font-size="28" fill="#A0A0B0" text-anchor="middle">Charlie</text>
    <rect x="20" y="70" width="40" height="50" rx="8" fill="#E91E63" />
    <rect x="75" y="70" width="40" height="50" rx="8" fill="#FF9800" />
    <rect x="130" y="70" width="40" height="50" rx="8" fill="#4CAF50" />
    <rect x="185" y="70" width="40" height="50" rx="8" fill="#9C27B0" />
    <rect x="240" y="70" width="40" height="50" rx="8" fill="#2196F3" />
  </g>

  <!-- Center Zone: The Supply -->
  <rect x="90" y="320" width="900" height="600" rx="48" fill="#2B2B36" stroke="#3A3A4A" stroke-width="6" />
  <text x="540" y="400" font-family="sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF" text-anchor="middle">The Supply</text>

  <!-- 6 Face up tiles in supply -->
  <g transform="translate(190, 480)">
    <g transform="translate(0, 0)">
      <rect width="180" height="260" rx="32" fill="#4CAF50" stroke="#388E3C" stroke-width="8" />
      <text x="90" y="160" font-family="sans-serif" font-weight="900" font-size="90" fill="#FFFFFF" text-anchor="middle">12</text>
      <circle cx="90" cy="220" r="16" fill="#FFFFFF" />
    </g>
    <g transform="translate(260, 0)">
      <rect width="180" height="260" rx="32" fill="#9C27B0" stroke="#7B1FA2" stroke-width="8" />
      <text x="90" y="160" font-family="sans-serif" font-weight="900" font-size="90" fill="#FFFFFF" text-anchor="middle">34</text>
      <circle cx="60" cy="220" r="16" fill="#FFFFFF" />
      <circle cx="120" cy="220" r="16" fill="#FFFFFF" />
    </g>
    <g transform="translate(520, 0)">
      <rect width="180" height="260" rx="32" fill="#FF9800" stroke="#F57C00" stroke-width="8" />
      <text x="90" y="160" font-family="sans-serif" font-weight="900" font-size="90" fill="#FFFFFF" text-anchor="middle">45</text>
      <circle cx="45" cy="220" r="16" fill="#FFFFFF" />
      <circle cx="90" cy="220" r="16" fill="#FFFFFF" />
      <circle cx="135" cy="220" r="16" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(180, 1000)">
    <rect width="320" height="120" rx="60" fill="#4CAF50" />
    <text x="160" y="75" font-family="sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF" text-anchor="middle">REVEAL TILE</text>
  </g>
  <g transform="translate(580, 1000)">
