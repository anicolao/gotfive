<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: 70s Wood Table -->
  <rect width="800" height="600" fill="#3E2723" />
  
  <!-- Central Game Area: Avocado Green Circle -->
  <circle cx="400" cy="300" r="220" fill="#558B2F" stroke="#2E7D32" stroke-width="8" />
  
  <!-- Central Pool of Tiles -->
  <g id="tile-pool">
    <!-- Tile 1 (Sassy 1) -->
    <g transform="translate(370, 260) rotate(15)">
      <rect width="50" height="70" rx="8" fill="#FFF9C4" stroke="#795548" stroke-width="2" />
      <text x="25" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="32" text-anchor="middle" fill="#D84315">1</text>
      <!-- Sassy Face -->
      <path d="M18 25 Q25 22 32 25" stroke="black" fill="none" stroke-width="2" /> <!-- Raised eyebrow -->
      <circle cx="20" cy="32" r="2" fill="black" />
      <circle cx="30" cy="32" r="2" fill="black" />
      <path d="M22 52 Q25 55 28 52" stroke="black" fill="none" stroke-width="2" /> <!-- Smirk -->
    </g>

    <!-- Tile 2 (Winking 2) -->
    <g transform="translate(420, 280) rotate(-10)">
      <rect width="50" height="70" rx="8" fill="#FFF9C4" stroke="#795548" stroke-width="2" />
      <text x="25" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="32" text-anchor="middle" fill="#1565C0">2</text>
      <!-- Sassy Face -->
      <circle cx="20" cy="32" r="2" fill="black" />
      <path d="M28 32 Q32 30 32 34" stroke="black" fill="none" stroke-width="2" /> <!-- Wink -->
      <path d="M20 50 Q25 55 30 50" stroke="black" fill="none" stroke-width="2" /> <!-- Smile -->
    </g>

    <!-- Tile 5 (Star-eyed 5) -->
    <g transform="translate(385, 310) rotate(5)">
      <rect width="50" height="70" rx="8" fill="#FFF9C4" stroke="#795548" stroke-width="2" />
      <text x="25" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="32" text-anchor="middle" fill="#F9A825">5</text>
      <!-- Sassy Face -->
      <path d="M15 32 L20 30 L25 32 L20 34 Z" fill="black" /> <!-- Star left -->
      <path d="M30 32 L35 30 L40 32 L35 34 Z" fill="black" /> <!-- Star right -->
      <circle cx="25" cy="52" r="5" fill="#D84315" /> <!-- O-mouth -->
    </g>
    
    <!-- Face-down Tiles -->
    <rect x="340" y="320" width="50" height="70" rx="8" fill="#795548" stroke="#3E2723" transform="rotate(-20, 365, 355)" />
    <rect x="430" y="240" width="50" height="70" rx="8" fill="#795548" stroke="#3E2723" transform="rotate(40, 455, 275)" />
  </g>

  <!-- Player Stands -->
  <!-- Bottom Stand (Main Player) -->
  <rect x="250" y="520" width="300" height="60" rx="4" fill="#5D4037" />
  <rect x="250" y="520" width="300" height="15" fill="#4E342E" /> <!-- Slot depth -->
  
  <!-- Tiles in Stand -->
  <g transform="translate(270, 480)">
    <rect width="45" height="65" rx="6" fill="#FFF9C4" />
    <text x="22" y="40" font-family="Arial" font-weight="bold" font-size="28" text-anchor="middle" fill="#C62828">?</text>
  </g>
  <g transform="translate(325, 480)">
    <rect width="45" height="65" rx="6" fill="#FFF9C4" />
    <text x="22" y="40" font-family="Arial" font-weight="bold" font-size="28" text-anchor="middle" fill="#C62828">?</text>
  </g>
  <g transform="translate(380, 480)">
    <rect width="45" height="65" rx="6" fill="#FFF9C4" />
    <text x="22" y="40" font-family="Arial" font-weight="bold" font-size="28" text-anchor="middle" fill="#C62828">?</text>
  </g>

  <!-- Other Player Stands (Simplified) -->
  <rect x="20" y="200" width="40" height="200" rx="4" fill="#5D4037" /> <!-- Left -->
  <rect x="740" y="200" width="40" height="200" rx="4" fill="#5D4037" /> <!-- Right -->
  <rect x="300" y="20" width="200" height="40" rx="4" fill="#5D4037" /> <!-- Top -->

  <!-- Game Title -->
  <text x="400" y="100" font-family="'Comic Sans MS', cursive" font-size="64" font-weight="black" text-anchor="middle" fill="#EF6C00" stroke="#FFF9C4" stroke-width="2">GOT FIVE!</text>
</svg>
