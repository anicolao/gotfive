    <text x="160" y="75" font-family="sans-serif" font-weight="bold" font-size="36" fill="#FFFFFF" text-anchor="middle">ASK CLUE</text>
  </g>

  <!-- Bottom-Mid Zone: My Stand -->
  <g transform="translate(40, 1260)">
    <rect width="1000" height="340" rx="40" fill="#3A3A4A" stroke="#4A4A5A" stroke-width="6" />
    <text x="500" y="60" font-family="sans-serif" font-weight="bold" font-size="40" fill="#FFFFFF" text-anchor="middle">My Hidden Tiles</text>
    
    <g transform="translate(40, 100)">
      <g transform="translate(0, 0)">
        <rect width="160" height="220" rx="24" fill="#1E1E24" stroke="#555566" stroke-width="6" />
        <text x="80" y="140" font-family="sans-serif" font-weight="bold" font-size="80" fill="#555566" text-anchor="middle">?</text>
      </g>
      <!-- Sorting Notch Highlight -->
      <polygon points="170,260 180,240 190,260" fill="#4CAF50" />
      
      <g transform="translate(190, 0)">
        <rect width="160" height="220" rx="24" fill="#1E1E24" stroke="#555566" stroke-width="6" />
        <text x="80" y="140" font-family="sans-serif" font-weight="bold" font-size="80" fill="#555566" text-anchor="middle">?</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="160" height="220" rx="24" fill="#1E1E24" stroke="#555566" stroke-width="6" />
        <text x="80" y="140" font-family="sans-serif" font-weight="bold" font-size="80" fill="#555566" text-anchor="middle">?</text>
      </g>
      <g transform="translate(570, 0)">
        <rect width="160" height="220" rx="24" fill="#1E1E24" stroke="#555566" stroke-width="6" />
        <text x="80" y="140" font-family="sans-serif" font-weight="bold" font-size="80" fill="#555566" text-anchor="middle">?</text>
      </g>
      <g transform="translate(760, 0)">
        <rect width="160" height="220" rx="24" fill="#1E1E24" stroke="#555566" stroke-width="6" />
        <text x="80" y="140" font-family="sans-serif" font-weight="bold" font-size="80" fill="#555566" text-anchor="middle">?</text>
      </g>
    </g>
  </g>

  <!-- Bottom Dock -->
  <rect x="0" y="1760" width="1080" height="160" fill="#2B2B36" rx="40" />
  <rect x="440" y="1790" width="200" height="16" rx="8" fill="#555566" />
  <text x="540" y="1860" font-family="sans-serif" font-weight="bold" font-size="48" fill="#FFFFFF" text-anchor="middle">Deduction Board</text>
  <path d="M510,1820 L540,1800 L570,1820" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" />
</svg>