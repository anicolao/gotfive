<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: 70s Patterned Wallpaper -->
  <rect width="800" height="600" fill="#8D6E63" />
  <g opacity="0.2">
    <circle cx="100" cy="100" r="80" fill="#FFAB91" />
    <circle cx="300" cy="100" r="80" fill="#FFAB91" />
    <circle cx="500" cy="100" r="80" fill="#FFAB91" />
    <circle cx="700" cy="100" r="80" fill="#FFAB91" />
    <circle cx="100" cy="300" r="80" fill="#FFAB91" />
    <circle cx="300" cy="300" r="80" fill="#FFAB91" />
    <circle cx="500" cy="300" r="80" fill="#FFAB91" />
    <circle cx="700" cy="300" r="80" fill="#FFAB91" />
  </g>

  <!-- Lobby Card -->
  <rect x="150" y="100" width="500" height="400" rx="20" fill="#FFF9C4" stroke="#5D4037" stroke-width="6" />
  
  <!-- Title -->
  <text x="400" y="160" font-family="'Comic Sans MS', cursive" font-size="48" font-weight="black" text-anchor="middle" fill="#D84315">GAME LOBBY</text>
  
  <!-- Room Info -->
  <rect x="200" y="190" width="400" height="40" rx="10" fill="#F5F5DC" stroke="#795548" stroke-width="2" />
  <text x="220" y="217" font-family="monospace" font-size="18" fill="#5D4037">ROOM ID: JIVE-TURKEY-74</text>
  <text x="580" y="217" font-family="Arial" font-size="14" font-weight="bold" fill="#2E7D32" text-anchor="end">HOSTED BY YOU</text>

  <!-- Player List -->
  <g transform="translate(200, 250)">
    <text x="0" y="0" font-family="Arial" font-weight="bold" font-size="20" fill="#795548">PLAYERS (3/4):</text>
    
    <!-- Player 1 -->
    <g transform="translate(0, 30)">
      <circle cx="15" cy="10" r="10" fill="#D84315" />
      <text x="35" y="17" font-family="Arial" font-size="18" fill="#5D4037">You (The Groovy One)</text>
    </g>
    
    <!-- Player 2 -->
    <g transform="translate(0, 70)">
      <circle cx="15" cy="10" r="10" fill="#1565C0" />
      <text x="35" y="17" font-family="Arial" font-size="18" fill="#5D4037">Disco Dan</text>
      <text x="380" y="17" font-family="Arial" font-size="14" fill="#2E7D32" text-anchor="end">READY</text>
    </g>

    <!-- Player 3 -->
    <g transform="translate(0, 110)">
      <circle cx="15" cy="10" r="10" fill="#2E7D32" />
      <text x="35" y="17" font-family="Arial" font-size="18" fill="#5D4037">Starbuck</text>
      <text x="380" y="17" font-family="Arial" font-size="14" fill="#F9A825" text-anchor="end">WAITING...</text>
    </g>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(250, 420)">
    <!-- Copy Link Button -->
    <rect width="140" height="40" rx="20" fill="#FFB74D" stroke="#E65100" stroke-width="2" />
    <text x="70" y="25" font-family="Arial" font-weight="bold" font-size="14" text-anchor="middle" fill="#BF360C">INVITE LINK</text>
    
    <!-- Start Button -->
    <rect x="160" width="140" height="40" rx="20" fill="#4CAF50" stroke="#1B5E20" stroke-width="2" />
    <text x="230" y="25" font-family="Arial" font-weight="bold" font-size="14" text-anchor="middle" fill="white">START GAME</text>
  </g>

  <!-- Decorative Sassy Tile -->
  <g transform="translate(680, 480) rotate(-15) scale(0.8)">
    <rect width="50" height="70" rx="8" fill="#FFF9C4" stroke="#795548" stroke-width="2" />
    <text x="25" y="45" font-family="Arial" font-weight="bold" font-size="32" text-anchor="middle" fill="#D84315">5</text>
    <circle cx="20" cy="32" r="2" fill="black" />
    <circle cx="30" cy="32" r="2" fill="black" />
    <path d="M20 50 Q25 55 30 50" stroke="black" fill="none" stroke-width="2" />
  </g>
</svg>
