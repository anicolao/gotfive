<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Retro Wood Table -->
  <rect width="200" height="250" fill="#3E2723" />
  
  <!-- Sassy Tile: Red 1 -->
  <g transform="translate(60, 50)">
    <!-- Shadow -->
    <rect x="4" y="4" width="80" height="110" rx="12" fill="rgba(0,0,0,0.4)" />
    <!-- Plastic Body (Harvest Gold color) -->
    <rect width="80" height="110" rx="12" fill="#FFD54F" stroke="#5D4037" stroke-width="3" />
    
    <!-- Sassy Face -->
    <!-- Eyes -->
    <path d="M25,30 Q30,25 35,30" stroke="black" stroke-width="2" fill="none" /> <!-- Wink -->
    <circle cx="55" cy="30" r="3" fill="black" /> <!-- Open eye -->
    
    <!-- Mouth -->
    <path d="M35,45 Q40,50 45,45" stroke="black" stroke-width="2" fill="none" /> <!-- Smirk -->

    <!-- Number (Red) -->
    <text x="40" y="85" font-family="'Cooper Black', 'Arial Black', serif" font-size="40" text-anchor="middle" fill="#D32F2F">1</text>
    
    <!-- Dot (Red) -->
    <circle cx="40" cy="100" r="4" fill="#D32F2F" />
  </g>

  <!-- Title -->
  <text x="100" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFCCBC">MOCKUP: SASSY TILE CONCEPT</text>
  <text x="100" y="220" font-family="Arial" font-size="10" text-anchor="middle" fill="#BCAAA4">70s Retro Aesthetics - Expressive Plastic</text>
</svg>
