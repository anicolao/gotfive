<svg viewBox="0 0 1080 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="800" fill="#1E1E24" />
  <text x="540" y="120" font-family="sans-serif" font-weight="bold" font-size="64" fill="#FFFFFF" text-anchor="middle">Sassy Tiles Aesthetics</text>

  <!-- Sassy Tile 1 -->
  <g transform="translate(200, 250)">
    <rect width="280" height="400" rx="40" fill="#E91E63" stroke="#C2185B" stroke-width="12" />
    <text x="140" y="220" font-family="sans-serif" font-weight="900" font-size="140" fill="#FFFFFF" text-anchor="middle">23</text>
    <!-- Sassy face -->
    <path d="M 80 110 Q 110 80 140 110" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" />
    <path d="M 200 110 Q 170 80 140 110" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" />
    <circle cx="100" cy="140" r="14" fill="#FFFFFF" />
    <circle cx="180" cy="140" r="14" fill="#FFFFFF" />
    <path d="M 100 280 Q 140 320 180 280" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" />
    <!-- Dots -->
    <circle cx="140" cy="340" r="20" fill="#FFFFFF" />
  </g>

  <!-- Sassy Tile 2 -->
  <g transform="translate(600, 250)">
    <rect width="280" height="400" rx="40" fill="#2196F3" stroke="#1976D2" stroke-width="12" />
    <text x="140" y="220" font-family="sans-serif" font-weight="900" font-size="140" fill="#FFFFFF" text-anchor="middle">45</text>
    <!-- Sassy face -->
    <line x1="80" y1="110" x2="130" y2="130" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <line x1="200" y1="110" x2="150" y2="130" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <circle cx="110" cy="160" r="12" fill="#FFFFFF" />
    <circle cx="170" cy="160" r="12" fill="#FFFFFF" />
    <path d="M 110 280 Q 140 260 170 280" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" />
    <!-- Dots -->
    <circle cx="90" cy="340" r="20" fill="#FFFFFF" />
    <circle cx="140" cy="340" r="20" fill="#FFFFFF" />
    <circle cx="190" cy="340" r="20" fill="#FFFFFF" />
  </g>
</svg>