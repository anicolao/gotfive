<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1920" fill="#1E1E24" />
  <text x="540" y="120" font-family="sans-serif" font-weight="bold" font-size="64" fill="#FFFFFF" text-anchor="middle">Deduction Board</text>
  <rect x="440" y="30" width="200" height="16" rx="8" fill="#555566" />
  <path d="M510,70 L540,90 L570,70" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Board Grid -->
  <g transform="translate(40, 200)">
    <!-- Column Backgrounds -->
    <rect x="0" y="0" width="190" height="1600" rx="32" fill="#1B3320" stroke="#4CAF50" stroke-width="6" /> <!-- Green -->
    <rect x="202" y="0" width="190" height="1600" rx="32" fill="#311B33" stroke="#9C27B0" stroke-width="6" /> <!-- Purple -->
    <rect x="404" y="0" width="190" height="1600" rx="32" fill="#33241B" stroke="#FF9800" stroke-width="6" /> <!-- Orange -->
    <rect x="606" y="0" width="190" height="1600" rx="32" fill="#1B2733" stroke="#2196F3" stroke-width="6" /> <!-- Blue -->
    <rect x="808" y="0" width="190" height="1600" rx="32" fill="#331B22" stroke="#E91E63" stroke-width="6" /> <!-- Pink -->

    <!-- Row 1 -->
    <g transform="translate(15, 30)">
      <rect width="160" height="120" rx="20" fill="#4CAF50" />
      <text x="80" y="80" font-family="sans-serif" font-weight="900" font-size="60" fill="#FFFFFF" text-anchor="middle">1</text>
      <!-- Crossed out state -->
      <line x1="20" y1="20" x2="140" y2="100" stroke="#000000" stroke-width="12" opacity="0.6" />
      <line x1="140" y1="20" x2="20" y2="100" stroke="#000000" stroke-width="12" opacity="0.6" />
    </g>
    
    <g transform="translate(217, 30)">
      <rect width="160" height="120" rx="20" fill="#9C27B0" opacity="0.4" />
      <text x="80" y="80" font-family="sans-serif" font-weight="900" font-size="60" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>

    <g transform="translate(419, 30)">
      <rect width="160" height="120" rx="20" fill="#FF9800" />
      <text x="80" y="80" font-family="sans-serif" font-weight="900" font-size="60" fill="#FFFFFF" text-anchor="middle">3</text>
      <!-- Circled/Starred state -->
      <circle cx="80" cy="60" r="50" fill="none" stroke="#FFFFFF" stroke-width="12" />
    </g>
    
    <g transform="translate(621, 30)">
      <rect width="160" height="120" rx="20" fill="#2196F3" opacity="0.4" />
      <text x="80" y="80" font-family="sans-serif" font-weight="900" font-size="60" fill="#FFFFFF" text-anchor="middle">4</text>
    </g>

    <g transform="translate(823, 30)">
      <rect width="160" height="120" rx="20" fill="#E91E63" opacity="0.4" />
      <text x="80" y="80" font-family="sans-serif" font-weight="900" font-size="60" fill="#FFFFFF" text-anchor="middle">5</text>
    </g>
  </g>
</svg>